<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Cup 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-screen" id="login-screen">
    <div class="login-box">
      <pre class="ascii-banner login-banner" id="login-banner"></pre>
      <div class="login-title">(@) World Cup 2026</div>
      <p class="login-sub">Enter password to continue</p>
      <input type="password" id="login-pw" class="login-input" placeholder="Password" autocomplete="off" />
      <button class="btn-primary login-btn" id="login-btn">Enter</button>
      <p class="login-error" id="login-error"></p>
    </div>
  </div>

  <div class="app-content" id="app-content" style="display:none">
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <div class="logo">(@) World Cup 2026</div>
        <div class="header-right">
          <button class="theme-toggle" id="theme-toggle" aria-label="Toggle appearance">
            <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="3.5" stroke="currentColor" stroke-width="1.4"/>
              <path d="M8 1.5V3M8 13V14.5M1.5 8H3M13 8H14.5M3.4 3.4L4.5 4.5M11.5 11.5L12.6 12.6M3.4 12.6L4.5 11.5M11.5 4.5L12.6 3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M13.5 9.5A5.5 5.5 0 016.5 2.5 5.5 5.5 0 108 13.5a5.5 5.5 0 005.5-4z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="theme-toggle" id="logout-btn" aria-label="Logout">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M6 2H3.5A1.5 1.5 0 002 3.5v9A1.5 1.5 0 003.5 14H6M10.5 11.5L14 8l-3.5-3.5M14 8H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="banner-section">
      <pre class="ascii-banner" id="ascii-banner"></pre>
    </section>

    <section class="metrics-section">
      <div class="metrics" id="metrics"></div>
    </section>

    <section class="matches-section" id="match-list"></section>
  </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
